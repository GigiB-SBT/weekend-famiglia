name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Estrai lo zip caricato da telefono
        run: |
          zip="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
          if [ -n "$zip" ]; then
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -q "$zip" -d /tmp/src
            if [ -f /tmp/src/package.json ]; then src=/tmp/src; else src="$(ls -d /tmp/src/*/ | head -n 1)"; fi
            rm -rf "$src/.github"
            cp -a "$src"/. ./
            git rm -q "$zip"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Codice estratto da $zip"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web statica
        run: npm run build:mobile

      - name: Progetto Android
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#1d5fd1' --splashBackgroundColor '#1d5fd1'
          npx cap sync android

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "weekend-famiglia-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: weekend-famiglia-apk
          path: weekend-famiglia-*.apk
          retention-days: 30

      - name: Pubblica come pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Weekend in Famiglia beta ${{ github.run_number }}
          prerelease: true
          files: weekend-famiglia-*.apk
          body: |
            APK di prova per uso personale (firmata con chiave di debug, non per il Play Store).
            Installazione: apri il file dal telefono e consenti l'installazione da questa fonte.
