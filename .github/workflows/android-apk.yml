name: Android APK

# Builds an installable debug APK of the app on every push to main
# (or by hand: Actions → Android APK → Run workflow).
# Download it from the run page, section "Artifacts".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build static web app
        run: npm run build:mobile

      - name: Create Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#1d5fd1' --splashBackgroundColor '#1d5fd1'
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weekend-famiglia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
