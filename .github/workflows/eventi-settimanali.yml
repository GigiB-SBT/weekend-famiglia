name: Eventi settimanali

# Every morning: reads the public agendas and saves the events in the code (the app
# downloads them at the next opening). On Wednesdays, and when run by hand, it also
# opens a GitHub issue "N eventi da approvare" (GitHub emails it to you).
# Run by hand: Actions → Eventi settimanali → Run workflow.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leggi le agende
        id: fetch
        run: node --no-warnings scripts/fetch-events.mjs

      - name: Salva i candidati
        run: |
          files="src/data/event-candidates.json src/data/event-adults.json src/data/event-candidates-meta.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add $files
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -q -m "Eventi aggiornati"
            git pull -q --rebase origin main
            git push
          fi

      - name: Che giorno è
        id: day
        run: echo "dow=$(TZ=Europe/Rome date +%u)" >> "$GITHUB_OUTPUT"

      - name: Mail al founder (issue GitHub, il mercoledì)
        if: github.event_name == 'workflow_dispatch' || steps.day.outputs.dow == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.fetch.outputs.count }} eventi da approvare · $(date +%d/%m)" \
            --body-file events-report.md
