name: Eventi settimanali

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leggi le agende
        id: fetch
        run: node --no-warnings scripts/fetch-events.mjs
      - name: Salva i candidati
        run: |
          if git diff --quiet -- src/data/event-candidates.json; then
            echo "Nessuna novità nei candidati."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add src/data/event-candidates.json
            git commit -q -m "Eventi candidati della settimana"
            git push
          fi
      - name: Mail al founder (issue GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "${{ steps.fetch.outputs.count }} eventi da approvare · $(date +%d/%m)" --body-file events-report.md
      - name: Ricostruisci l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref main
