name: Eventi settimanali

# Every Wednesday morning: reads the public agendas, saves the candidates in the
# code, opens a GitHub issue "N eventi da approvare" (GitHub emails it to you)
# The app downloads the new events by itself at the next opening (no APK rebuild).
# Run by hand: Actions → Eventi settimanali → Run workflow.

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leggi le agende
        id: fetch
        run: node --no-warnings scripts/fetch-events.mjs

      - name: Salva i candidati
        run: |
          files="src/data/event-candidates.json src/data/event-adults.json src/data/event-candidates-meta.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add $files
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -q -m "Eventi della settimana"
            git pull -q --rebase origin main
            git push
          fi

      - name: Mail al founder (issue GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.fetch.outputs.count }} eventi da approvare · $(date +%d/%m)" \
            --body-file events-report.md
